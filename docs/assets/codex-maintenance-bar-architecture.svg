<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Codex Maintenance Bar architecture</title>
  <desc id="desc">A diagram showing the macOS menu bar app, bundled maintenance script, manual actions, LaunchAgent schedule, start at login, and report outputs.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#2f4858" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill: #fbfaf7; }
      .title { fill: #18242f; font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #54616d; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #ffffff; stroke: #d9e0e4; stroke-width: 2; filter: url(#shadow); }
      .box-alt { fill: #f3fbf9; stroke: #9ed8cd; stroke-width: 2; filter: url(#shadow); }
      .box-warn { fill: #fff8ec; stroke: #f0c36a; stroke-width: 2; filter: url(#shadow); }
      .box-out { fill: #f9fbff; stroke: #aabbd4; stroke-width: 2; filter: url(#shadow); }
      .label { fill: #18242f; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #54616d; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .code { fill: #334155; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { stroke: #2f4858; stroke-width: 3; marker-end: url(#arrow); }
      .dash { stroke: #e86f51; stroke-width: 3; stroke-dasharray: 7 8; marker-end: url(#arrow); }
      .pill { fill: #e7f5f1; stroke: #a9d8ce; stroke-width: 1.5; }
      .pill-text { fill: #1f6f63; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="620" rx="28"/>
  <text class="title" x="52" y="58">Codex Maintenance Bar</text>
  <text class="subtitle" x="52" y="86">Native macOS status bar controls for manual cleanup, weekly scheduling, login launch, and reports.</text>

  <rect class="box" x="52" y="128" width="220" height="126" rx="18"/>
  <text class="label" x="82" y="168">Menu Bar UI</text>
  <text class="small" x="82" y="196">Audit Now</text>
  <text class="small" x="82" y="218">Cleanup Now</text>
  <text class="small" x="82" y="240">Open Latest Report</text>

  <rect class="box-alt" x="342" y="128" width="232" height="126" rx="18"/>
  <text class="label" x="372" y="168">Runner Service</text>
  <text class="small" x="372" y="196">Runs bundled Python</text>
  <text class="small" x="372" y="218">Streams output</text>
  <text class="small" x="372" y="240">Opens reports</text>

  <rect class="box-warn" x="644" y="128" width="226" height="126" rx="18"/>
  <text class="label" x="674" y="168">Bundled Script</text>
  <text class="code" x="674" y="197">codex_weekly_maintenance.py</text>
  <text class="small" x="674" y="223">Closes Codex for cleanup</text>
  <text class="small" x="674" y="245">Backs up before apply</text>

  <rect class="box-out" x="940" y="128" width="208" height="126" rx="18"/>
  <text class="label" x="970" y="168">Codex State</text>
  <text class="small" x="970" y="196">Sessions</text>
  <text class="small" x="970" y="218">Config and DBs</text>
  <text class="small" x="970" y="240">Logs and worktrees</text>

  <path class="arrow" d="M272 191H332"/>
  <path class="arrow" d="M574 191H634"/>
  <path class="arrow" d="M870 191H930"/>

  <rect class="box" x="68" y="346" width="238" height="132" rx="18"/>
  <text class="label" x="98" y="385">Weekly Schedule</text>
  <text class="small" x="98" y="413">User LaunchAgent</text>
  <text class="small" x="98" y="435">Monday 9:00 AM</text>
  <text class="small" x="98" y="457">Runs without app open</text>

  <rect class="box" x="376" y="346" width="238" height="132" rx="18"/>
  <text class="label" x="406" y="385">Start at Login</text>
  <text class="small" x="406" y="413">Login LaunchAgent</text>
  <text class="small" x="406" y="435">Opens status item</text>
  <text class="small" x="406" y="457">Survives restarts</text>

  <rect class="box-alt" x="684" y="346" width="238" height="132" rx="18"/>
  <text class="label" x="714" y="385">Sync Check</text>
  <text class="small" x="714" y="413">Compares bundled copy</text>
  <text class="small" x="714" y="435">Uses maintenance repo</text>
  <text class="small" x="714" y="457">Guarded by CI</text>

  <rect class="box-out" x="992" y="346" width="156" height="132" rx="18"/>
  <text class="label" x="1022" y="385">Outputs</text>
  <text class="small" x="1022" y="413">Reports</text>
  <text class="small" x="1022" y="435">Backups</text>
  <text class="small" x="1022" y="457">Logs</text>

  <path class="dash" d="M187 346V294C187 270 342 270 435 254"/>
  <path class="dash" d="M495 346V294C495 270 468 276 458 254"/>
  <path class="arrow" d="M803 346V294C803 270 758 276 757 254"/>
  <path class="arrow" d="M870 412H982"/>

  <rect class="pill" x="76" y="522" width="210" height="38" rx="19"/>
  <text class="pill-text" x="108" y="546">native status bar app</text>
  <rect class="pill" x="310" y="522" width="222" height="38" rx="19"/>
  <text class="pill-text" x="342" y="546">no skill install required</text>
  <rect class="pill" x="556" y="522" width="226" height="38" rx="19"/>
  <text class="pill-text" x="588" y="546">reports open after runs</text>
  <rect class="pill" x="806" y="522" width="250" height="38" rx="19"/>
  <text class="pill-text" x="838" y="546">source script stays in sync</text>
</svg>
