name: Build

on:
  push:
  pull_request:

jobs:
  swiftpm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check bundled maintenance script
        run: ./script/sync_maintenance_script.sh --check
      - name: Check shell scripts
        run: bash -n script/*.sh
      - name: Build
        run: swift build
