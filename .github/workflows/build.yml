name: Build

on:
  push:
  pull_request:

jobs:
  swiftpm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check bundled Python scripts
        run: python3 -m py_compile Sources/CodexPowertoyz/Resources/*.py
      - name: Check shell scripts
        run: bash -n script/*.sh
      - name: Build
        run: swift build
